<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="title">
        <h2>Welcome to Tic Tac Toe Game</h2>
    </div>

    <div id="box">
        <div class="square" id="box0"></div>
        <div class="square" id="box1"></div>
        <div class="square" id="box2"></div>
        <div class="square" id="box3"></div>
        <div class="square" id="box4"></div>
        <div class="square" id="box5"></div>
        <div class="square" id="box6"></div>
        <div class="square" id="box7"></div>
        <div class="square" id="box8"></div>
    </div>

    <div id="endGame">
        <input type="button" value="Reset" id="resetGame" onclick="restartButton()">
    </div>

    <script src="app.js"></script>
</body>
</html>
